name: Auto Merge Copilot PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false && (startsWith(github.event.pull_request.head.ref, 'copilot/') || github.event.pull_request.user.login == 'Copilot')
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub auto-merge for Copilot PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --auto \
            --squash
