name: OSSF Scorecard

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OSSF Scorecard
        if: github.event_name != 'workflow_dispatch'
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Remove non-comparable branch protection category
        if: github.event_name != 'workflow_dispatch'
        run: |
          jq '
            .runs |= map(
              select(
                ((.automationDetails.id // "")
                  | startswith("supply-chain/branch-protection/")
                  | not)
              )
            )
          ' results.sarif > results.normalized.sarif
          mv results.normalized.sarif results.sarif
          jq -e '(.runs | length) > 0' results.sarif

      - name: Attest successful PR Scorecard analysis for current head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/scorecard.yml/runs?event=pull_request&per_page=100"
          scorecard_run_url="$(
            curl -fsSL \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${runs_url}" \
            | jq -r --arg sha "${GITHUB_SHA}" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and .conclusion == "success")
                  | .html_url][0] // empty
              '
          )"
          test -n "${scorecard_run_url}" || {
            echo "No successful pull_request Scorecard run found for ${GITHUB_SHA}" >&2
            exit 1
          }

          jq -n \
            --arg run_url "${scorecard_run_url}" \
            --arg sha "${GITHUB_SHA}" \
            '{
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              version: "2.1.0",
              runs: [{
                tool: {driver: {
                  name: "Scorecard",
                  informationUri: "https://github.com/ossf/scorecard",
                  semanticVersion: "2.4.3",
                  rules: [{
                    id: "SCORECARD-HEAD-ATTESTATION",
                    name: "Current head Scorecard attestation",
                    shortDescription: {text: "The current head has a successful OSSF Scorecard PR run."},
                    properties: {"security-severity": "0.0"}
                  }]
                }},
                results: [{
                  ruleId: "SCORECARD-HEAD-ATTESTATION",
                  level: "note",
                  message: {text: ("Successful OSSF Scorecard PR analysis for " + $sha + ": " + $run_url)},
                  locations: [{physicalLocation: {
                    artifactLocation: {uri: ".github/workflows/scorecard.yml"},
                    region: {startLine: 1}
                  }}]
                }]
              }]
            }' > results.sarif

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
